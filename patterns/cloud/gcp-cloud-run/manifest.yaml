id: gcp-cloud-run
format: 1
visibility: public
version: 1
triggers:
  - gcp
  - google cloud
  - cloud run
  - terraform
  - deploy
  - container
  - secret manager
  - artifact registry
signatures:
  - Dockerfile
  - "**/infra/*.tf"
inputs:
  - the GCP project id and region
  - the service name and the image tag to deploy
  - which principals may call it (private by default)
  - the secrets it needs, by name
verified-against:
  tag: terraform-1.9.8 google-provider (>=6,<8) eclipse-temurin-21-jre; validate and container run green in CI on PR #1
  date: 2026-10-21
supersedes: ~
