name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # weekly: a pattern can go stale when its tools move on
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patterns:
    runs-on: ubuntu-latest
    env:
      GM_REQUIRE_ALL: "1"   # a check that cannot run here fails; nothing passes untested
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Install actionlint
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          # From the release's actionlint_1.7.7_checksums.txt.
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint_1.7.7_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf actionlint_1.7.7_linux_amd64.tar.gz actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check every pattern's sources.yaml (shape; the urls are checked by the sources job)
        env:
          GM_SCHEMA_ONLY: "1"
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user --quiet pyyaml
          sh scripts/check-sources.sh
          sh scripts/test-check-sources.sh
      - name: Run every pattern's check.sh
        run: |
          set -e
          for c in patterns/*/*/check.sh; do
            echo "::group::$c"
            sh "$c"
            echo "::endgroup::"
          done

  # Every source url resolves. Weekly and on demand only: a third-party docs site having a bad day
  # must not block an unrelated PR. A red weekly run is the signal that a pattern's sources moved.
  sources:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GM_REQUIRE_ALL: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Every source url resolves
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user --quiet pyyaml
          sh scripts/check-sources.sh

  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: global-memory
      - uses: actions/checkout@v4
        with:
          repository: enrichmeai/penstock
          ref: v0.5.3          # pinned: a Penstock change must not break this repository's CI unannounced
          path: penstock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate cards against memory format v1 (Penstock's checker)
        # Schema validation is what this job is for. Penstock's checker reads patterns/<id>/, so it
        # is given a flattened copy until it reads category folders (penstock#195). The checker also
        # calls each check.sh; GM_SCHEMA_ONLY=1 makes those skip their builds here, because the
        # "patterns" job is where the checks really run. Its STALE lines compare verified-against with
        # Penstock's own release tag, which does not apply here (penstock#195).
        env:
          GM_SCHEMA_ONLY: "1"
        run: |
          pip install pyyaml
          flat="$RUNNER_TEMP/flat"
          mkdir -p "$flat/patterns" "$flat/scripts"
          cp global-memory/memory.yaml "$flat/"
          cp -R global-memory/scripts/. "$flat/scripts/"
          for d in global-memory/patterns/*/*/; do cp -R "$d" "$flat/patterns/"; done
          for c in "$flat"/patterns/*/check.sh; do sed -E -i 's#\.\./\.\./\.\./scripts#../../scripts#; s#\.\./\.\./(language|architecture|cloud|ci)/#../#g' "$c"; done
          bash penstock/scripts/check-cards.sh --root "$flat"
